<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c6e6ee">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- HTML Meta Tags -->
    <title>all roads</title>
    <meta name="description" content="find the perfect meeting place">

    <!-- Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://allroads.noahgdorfman.com/">
    <meta property="og:title" content="allroads.noahgdorfman.com">
    <meta property="og:description" content="find the perfect meeting place">
    <meta property="og:image" content="https://allroads.noahgdorfman.com/assets/social.png?1234">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://allroads.noahgdorfman.com/">
    <meta name="twitter:title" content="allroads.noahgdorfman.com">
    <meta name="twitter:description" content="find the perfect meeting place">
    <meta name="twitter:image" content="https://allroads.noahgdorfman.com/assets/social.png?1234">

    <link rel="preconnect" href="https://maps.googleapis.com">
    <link rel="preconnect" href="https://api-clevp6kv7a-uc.a.run.app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=2">
    <script src="script.js?v=2" defer></script>
</head>

<body>
    <div class="app">
        <section class="panel">
            <header class="site-header">
                <img src="assets/favicon.png" alt="" class="logo" width="32" height="32">
                <div>
                    <h1>all roads</h1>
                    <p class="slogan">find the perfect meeting place</p>
                </div>
            </header>

            <form id="search-form" class="card" autocomplete="off">
                <div class="field">
                    <span class="field-label">Who's meeting?</span>
                    <ul id="people" class="people"></ul>
                    <div class="people-actions">
                        <button type="button" id="add-person" class="text-btn">+ Add person</button>
                        <button type="button" id="use-location" class="text-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                <circle cx="12" cy="12" r="4" fill="currentColor" />
                                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2" />
                            </svg>
                            Use my location
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="query">What are you looking for?</label>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2" />
                            <path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                        </svg>
                        <input type="search" id="query" placeholder="coffee, tacos, Starbucks…" enterkeyhint="search">
                    </div>
                    <div class="chips" id="chips">
                        <button type="button" class="chip" data-query="coffee">☕ Coffee</button>
                        <button type="button" class="chip" data-query="restaurant">🍽️ Restaurant</button>
                        <button type="button" class="chip" data-query="bar">🍻 Bar</button>
                        <button type="button" class="chip" data-query="brunch">🥞 Brunch</button>
                        <button type="button" class="chip" data-query="park">🌳 Park</button>
                        <button type="button" class="chip" data-query="dessert">🍦 Dessert</button>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">Getting there</span>
                    <div class="segmented" id="mode" role="radiogroup" aria-label="Travel mode">
                        <button type="button" role="radio" data-mode="driving" aria-checked="true">🚗 Drive</button>
                        <button type="button" role="radio" data-mode="transit" aria-checked="false">🚇 Transit</button>
                        <button type="button" role="radio" data-mode="walking" aria-checked="false">🚶 Walk</button>
                    </div>
                </div>

                <button type="submit" id="find-btn" class="primary-btn" disabled>Find the middle</button>
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </form>

            <section id="results" class="results" hidden>
                <div class="results-header">
                    <h2 id="results-title">Best spots</h2>
                    <button type="button" id="share-btn" class="share-btn">Share</button>
                </div>
                <p class="results-hint">Ranked by the fairest trip for everyone. Tap one to see details.</p>
                <ol id="venue-list" class="venue-list"></ol>
                <button type="button" id="more-btn" class="more-btn" hidden>Show more</button>
            </section>

            <footer>made with ❤️ for bringing people together</footer>
        </section>

        <div class="map-wrap empty" id="map-wrap">
            <div id="map"></div>
        </div>
    </div>
</body>

</html>
